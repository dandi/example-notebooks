name: Test changed notebooks

on:
  pull_request:
    paths:
      - '**.ipynb'
      - '.github/notebook-test-exclusions.txt'
      - '.github/scripts/run_notebook.py'
      - '.github/scripts/list_notebooks.py'
      - '.github/scripts/pr_preview.py'
      - '.github/workflows/test-changed-notebooks.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    name: Detect changed notebooks
    runs-on: ubuntu-latest
    outputs:
      notebooks: ${{ steps.list.outputs.notebooks }}
      any_changed: ${{ steps.list.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: List changed .ipynb files (after exclusions)
        id: list
        run: |
          set -euo pipefail
          changed=$(git diff --name-only --diff-filter=AM \
            origin/${{ github.base_ref }}...HEAD || true)
          notebooks=$(echo "$changed" | python .github/scripts/list_notebooks.py --changed-only)
          echo "notebooks=$notebooks" >> "$GITHUB_OUTPUT"
          count=$(echo "$notebooks" | python -c "import json,sys;print(len(json.load(sys.stdin)))")
          echo "Detected $count Colab-testable notebooks changed in this PR:"
          echo "$notebooks" | python -m json.tool
          if [ "$count" -gt 0 ]; then
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test ${{ matrix.notebook }}
    needs: detect
    if: needs.detect.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        notebook: ${{ fromJson(needs.detect.outputs.notebooks) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install runner dependencies
        run: pip install --no-cache-dir uv nbformat

      - name: Run notebook
        id: run
        # Executes through the real kernel and keeps the executed notebook so
        # reviewers can see the outputs.
        run: |
          slug=$(python -c "import sys; sys.path.insert(0, '.github/scripts'); from run_notebook import slugify; print(slugify(sys.argv[1]))" "${{ matrix.notebook }}")
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          python .github/scripts/run_notebook.py \
            "${{ matrix.notebook }}" \
            --output-dir "$RUNNER_TEMP/notebook-test" \
            --timeout 3600 \
            --executed-output "$RUNNER_TEMP/executed/$slug.ipynb"

      - name: Render executed notebook to HTML
        id: render
        if: always() && steps.run.outputs.slug != ''
        run: |
          slug='${{ steps.run.outputs.slug }}'
          status=none
          if [ -f "$RUNNER_TEMP/executed/$slug.ipynb" ]; then
            jupyter nbconvert --to html "$RUNNER_TEMP/executed/$slug.ipynb" \
              --output "$slug.html" --output-dir "$RUNNER_TEMP/executed"
            if [ '${{ steps.run.outcome }}' = 'success' ]; then status=pass; else status=fail; fi
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # The artifact name carries the result, so the PR comment can be rebuilt
      # from the run's artifact list alone (see pr_preview.py).
      - name: Upload executed notebook
        if: always() && steps.run.outputs.slug != ''
        uses: actions/upload-artifact@v4
        with:
          name: executed-${{ steps.run.outputs.slug }}-${{ steps.render.outputs.status }}
          path: ${{ runner.temp }}/executed/
          retention-days: 14
          if-no-files-found: ignore

      # Fork PRs only get a read-only token, so they keep the artifacts but
      # cannot deploy to gh-pages; same-repo PRs get clickable previews that
      # appear as each notebook finishes.
      - name: Publish to the PR preview and update the checklist
        if: always() && steps.run.outputs.slug != '' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          slug='${{ steps.run.outputs.slug }}'
          if [ -f "$RUNNER_TEMP/executed/$slug.html" ]; then
            python .github/scripts/pr_preview.py deploy \
              --pr ${{ github.event.pull_request.number }} --slug "$slug" \
              --html "$RUNNER_TEMP/executed/$slug.html"
          fi
          echo '${{ needs.detect.outputs.notebooks }}' > "$RUNNER_TEMP/notebooks.json"
          python .github/scripts/pr_preview.py comment \
            --pr ${{ github.event.pull_request.number }} --run-id ${{ github.run_id }} \
            --notebooks "$RUNNER_TEMP/notebooks.json" --head-sha ${{ github.event.pull_request.head.sha }}

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-${{ strategy.job-index }}
          path: ${{ runner.temp }}/notebook-test/
          retention-days: 14

  finalize-checklist:
    name: Finalize the executed-notebook checklist
    needs: [detect, test]
    # Each matrix job rebuilds the checklist when it finishes; this last pass
    # closes the window where two jobs finishing together read a stale
    # artifact list.
    if: always() && needs.detect.outputs.any_changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Rebuild the checklist from the run's artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install --no-cache-dir nbformat
          echo '${{ needs.detect.outputs.notebooks }}' > "$RUNNER_TEMP/notebooks.json"
          python .github/scripts/pr_preview.py comment \
            --pr ${{ github.event.pull_request.number }} --run-id ${{ github.run_id }} \
            --notebooks "$RUNNER_TEMP/notebooks.json" --head-sha ${{ github.event.pull_request.head.sha }}
