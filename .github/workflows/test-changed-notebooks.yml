name: Test changed notebooks

on:
  pull_request:
    paths:
      - '**.ipynb'
      - '.github/notebook-test-exclusions.txt'
      - '.github/scripts/run_notebook.py'
      - '.github/scripts/list_notebooks.py'
      - '.github/scripts/pr_preview.py'
      - '.github/workflows/deploy-executed-notebooks.yml'
      - '.github/workflows/test-changed-notebooks.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    name: Detect changed notebooks
    runs-on: ubuntu-latest
    outputs:
      notebooks: ${{ steps.list.outputs.notebooks }}
      any_changed: ${{ steps.list.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: List changed .ipynb files (after exclusions)
        id: list
        run: |
          set -euo pipefail
          changed=$(git diff --name-only --diff-filter=AM \
            origin/${{ github.base_ref }}...HEAD || true)
          notebooks=$(echo "$changed" | python .github/scripts/list_notebooks.py --changed-only)
          echo "notebooks=$notebooks" >> "$GITHUB_OUTPUT"
          count=$(echo "$notebooks" | python -c "import json,sys;print(len(json.load(sys.stdin)))")
          echo "Detected $count Colab-testable notebooks changed in this PR:"
          echo "$notebooks" | python -m json.tool
          if [ "$count" -gt 0 ]; then
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test ${{ matrix.notebook }}
    needs: detect
    if: needs.detect.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        notebook: ${{ fromJson(needs.detect.outputs.notebooks) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install runner dependencies
        run: pip install --no-cache-dir uv nbformat

      - name: Run notebook
        id: run
        # Executes through the real kernel and keeps the executed notebook so
        # reviewers can see the outputs.
        run: |
          slug=$(python -c "import sys; sys.path.insert(0, '.github/scripts'); from run_notebook import slugify; print(slugify(sys.argv[1]))" "${{ matrix.notebook }}")
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          python .github/scripts/run_notebook.py \
            "${{ matrix.notebook }}" \
            --output-dir "$RUNNER_TEMP/notebook-test" \
            --timeout 3600 \
            --executed-output "$RUNNER_TEMP/executed/$slug.ipynb"

      - name: Render executed notebook to HTML
        id: render
        if: always() && steps.run.outputs.slug != ''
        run: |
          slug='${{ steps.run.outputs.slug }}'
          status=none
          if [ -f "$RUNNER_TEMP/executed/$slug.ipynb" ]; then
            jupyter nbconvert --to html "$RUNNER_TEMP/executed/$slug.ipynb" \
              --output "$slug.html" --output-dir "$RUNNER_TEMP/executed"
            if [ '${{ steps.run.outcome }}' = 'success' ]; then status=pass; else status=fail; fi
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # The artifact name carries the result, so the PR comment can be rebuilt
      # from the run's artifact list alone (see pr_preview.py).
      - name: Upload executed notebook
        if: always() && steps.run.outputs.slug != ''
        uses: actions/upload-artifact@v4
        with:
          name: executed-${{ steps.run.outputs.slug }}-${{ steps.render.outputs.status }}
          path: ${{ runner.temp }}/executed/
          retention-days: 14
          if-no-files-found: ignore

      # Every write to gh-pages has to go through the gh-pages-deploy
      # concurrency group or it races the site deploys, so the matrix job
      # does not push itself: it dispatches the deploy workflow, which
      # publishes everything the run has produced so far and refreshes the
      # checklist. The dispatch resolves the workflow file on the default
      # branch, so it is best-effort here; the finalize job below covers the
      # end state regardless. Fork PRs only get a read-only token and keep
      # the artifacts instead.
      - name: Request a preview deploy and checklist update
        if: always() && steps.run.outputs.slug != '' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-executed-notebooks.yml --ref ${{ github.event.repository.default_branch }} \
            -f pr=${{ github.event.pull_request.number }} \
            -f run_id=${{ github.run_id }} \
            -f head_sha=${{ github.event.pull_request.head.sha }} \
            -f notebooks='${{ needs.detect.outputs.notebooks }}' \
            || echo "::notice::deploy workflow not dispatchable (not on the default branch yet); the checklist is finalized after the matrix"

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-${{ strategy.job-index }}
          path: ${{ runner.temp }}/notebook-test/
          retention-days: 14

  finalize-checklist:
    name: Finalize the executed-notebook checklist
    needs: [detect, test]
    # The dispatched deploys are best-effort and may be collapsed or
    # unavailable; this pass publishes the complete set and writes the
    # final checklist.
    if: always() && needs.detect.outputs.any_changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download executed notebooks
        uses: actions/download-artifact@v4
        with:
          pattern: executed-*
          path: executed
          merge-multiple: true

      - name: Collect preview files
        id: collect
        run: |
          mkdir -p publish
          cp executed/*.html publish/ 2>/dev/null || true
          if ls publish/*.html >/dev/null 2>&1; then echo "has_files=true" >> "$GITHUB_OUTPUT"; else echo "has_files=false" >> "$GITHUB_OUTPUT"; fi

      - name: Deploy executed notebooks to gh-pages
        if: steps.collect.outputs.has_files == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          destination_dir: pr-preview/${{ github.event.pull_request.number }}/notebooks
          keep_files: true
          commit_message: "Deploy executed notebooks for PR #${{ github.event.pull_request.number }}"
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      - name: Rebuild the checklist from the run's artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install --no-cache-dir nbformat
          echo '${{ needs.detect.outputs.notebooks }}' > "$RUNNER_TEMP/notebooks.json"
          python .github/scripts/pr_preview.py comment \
            --pr ${{ github.event.pull_request.number }} --run-id ${{ github.run_id }} \
            --notebooks "$RUNNER_TEMP/notebooks.json" --head-sha ${{ github.event.pull_request.head.sha }}
