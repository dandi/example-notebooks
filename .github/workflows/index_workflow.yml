name: DANDI Metadata Collector

on:
  push:
    branches: [ master ]
  workflow_dispatch:
  schedule:
    - cron: '30 6 * * 1'  # weekly, after the notebook test sweep, to refresh docker badges

jobs:
  collect-and-render:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests jinja2 nbformat 'dandi>=0.74.0'

    - name: Run metadata collector and renderer
      run: python .github/scripts/collect_and_render.py

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./output
        keep_files: true
        cname: notebooks.dandiarchive.org
